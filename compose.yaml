services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: travel_demo
      POSTGRES_USER: travel_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - travel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_app -d travel_demo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  travel_pgdata:
