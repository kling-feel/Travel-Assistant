# Cloud deployment is separate from the local acceptance Compose project.
# Supply a private env file with: docker compose --env-file data/generated/cloud.env -f compose.cloud.yaml ...
services:
  db:
    image: ${POSTGRES_IMAGE:?Pin the PostgreSQL image digest}
    env_file: ${TRAVEL_CLOUD_ENV_FILE:?Set an ignored cloud environment file}
    environment:
      POSTGRES_DB: travel_demo
      POSTGRES_USER: travel_app
    volumes:
      - travel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_app -d travel_demo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backup:
    profiles: [setup]
    image: ${POSTGRES_IMAGE:?Pin the PostgreSQL image digest}
    user: "0:0"
    env_file: ${TRAVEL_CLOUD_ENV_FILE:?Set an ignored cloud environment file}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - travel_backups:/backups
    entrypoint: ["sh", "-ec"]
    command:
      - >-
        test ! -e /backups/empty.dump;
        export PGPASSWORD="$${POSTGRES_PASSWORD}";
        pg_dump -h db -U travel_app -d travel_demo -Fc -f /backups/empty.dump;
        pg_restore -l /backups/empty.dump > /dev/null;
        chmod 600 /backups/empty.dump

  init:
    profiles: [setup]
    build:
      context: .
      target: initializer
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:?Pin the Python base image digest}
        REQUIREMENTS_FILE: requirements.lock
    env_file: ${TRAVEL_CLOUD_ENV_FILE:?Set an ignored cloud environment file}
    environment:
      DATABASE_URL: postgresql+psycopg://travel_app:${POSTGRES_PASSWORD:?Missing database password}@db:5432/travel_demo
      AI_API_KEY: ""
      ALIYUN_IQS_API_KEY: ""
      ALIYUN_IQS_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - travel_backups:/backups:ro
      - travel_manifest:/run/travel

  app:
    build:
      context: .
      target: runtime
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:?Pin the Python base image digest}
        REQUIREMENTS_FILE: requirements.lock
    env_file: ${TRAVEL_CLOUD_ENV_FILE:?Set an ignored cloud environment file}
    environment:
      DATABASE_URL: postgresql+psycopg://travel_app:${POSTGRES_PASSWORD:?Missing database password}@db:5432/travel_demo
      HOST: 0.0.0.0
      PORT: "8000"
      CLOUD_MODE: "true"
      PUBLIC_HOST: ${PUBLIC_HOST:?Missing public domain}
      ORIGINS: https://${PUBLIC_HOST:?Missing public domain}
    depends_on:
      db:
        condition: service_healthy
        restart: true
    volumes:
      - travel_manifest:/run/travel:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 5
    restart: unless-stopped

  account-admin:
    profiles: [admin]
    build:
      context: .
      target: runtime
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:?Pin the Python base image digest}
        REQUIREMENTS_FILE: requirements.lock
    user: "0:0"
    env_file: ${TRAVEL_CLOUD_ENV_FILE:?Set an ignored cloud environment file}
    environment:
      DATABASE_URL: postgresql+psycopg://travel_app:${POSTGRES_PASSWORD:?Missing database password}@db:5432/travel_demo
      CLOUD_MODE: "true"
      TRAVEL_CREDENTIAL_DIR: /run/travel-credentials
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/generated/cloud-accounts:/run/travel-credentials
    entrypoint: ["python", "scripts/manage_travelers.py"]

  proxy:
    image: ${CADDY_IMAGE:?Pin the Caddy image digest}
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Missing public domain}
      ACME_EMAIL: ${ACME_EMAIL:?Missing certificate contact email}
    ports:
      - "${CLOUD_BIND_ADDRESS:-0.0.0.0}:80:80"
      - "${CLOUD_BIND_ADDRESS:-0.0.0.0}:443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  travel_pgdata:
  travel_backups:
  travel_manifest:
  caddy_data:
  caddy_config:
